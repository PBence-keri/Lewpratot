<div class="container">
  <section id="cars">
    <h2>Bérelhető Autók</h2>
    <form class="d-flex mb-3" role="search">
      <input class="form-control me-2" type="search" placeholder="Keressen egy autót" aria-label="Search">
      <button class="btn btn-outline-light" type="submit">Keresés</button>
    </form>
    <div class="car-grid">
      <div class="car-card" ng-repeat="car in cars">
        <img ng-src="./img/{{car.kep}}">
        <h3>{{car.autonev}}</h3>
        <p>Lóerő: {{car.loero}} <br> Az autó fogyasztása 100km-eren: {{car.fogyasztas}} liter<br> Az autó váltója: {{car.valtos}} <br> Az autó üzem anyaga: {{car.uzemanyag}}</p>
        <p class="price">{{car.ar}} Ft/hónap</p>
        <button>Bérlés</button>
      </div>
    </div>
  </section>
</div>
