<div class="container-fluid">
  <div class="row">
    <h1 class="text-center mt-5 text-decoration-underline">Bérlés</h1>
    <div class="col-md-5">
      <div class="row justify-content-center">
        <div class="col-md-4 image mt-12 w-auto mt-5" >
          <div class="card text-white mt-4" style="border: 2px solid red;">
            <div class="card text-white col-md-12">
            <img src="./img/{{data.kep}}" class="card-img">
          </div>
        </div>
      </div>
    </div>
    <div class="row d-flex justify-content-center align-items-center mt-3">
      <button class="btn btn-danger col-md-12 w-auto katt" ui-sref="rental">Vissza</button>
    </div>
  </div>
  <div class="col-md-7">
    <section class="rentForm">
      <div class="container">
        <div class="row d-flex justify-content-center align-items-center">
          <div class="text">
            <div class="card rounded-3 text-black card-body rent col-md-12">
              <div class="col-lg-12">
                <div>
                  <form>
                    <div data-input-init class="form-outline mb-4">
                      <label class="form-label" for="name" style="color: white;">Felvétel helye:</label>
                      <input type="text" id="name" class="form-control rent2" placeholder="Pl.: Makó, Posta utca 4-6.">
                    </div>
                    <div data-input-init class="form-outline mb-4">
                      <label class="form-label" for="email" style="color: white;">Leadás helye:</label>
                      <input type="email" id="email" class="form-control rent2" placeholder="Pl.: Makó, Posta utca 4-6.">
                    </div>
                    <div data-input-init class="form-outline mb-4">
                      <label class="form-label" for="born" style="color: white;">Felvétel dátuma:</label>
                      <input type="date" id="born" class="form-control rent2">
                    </div>
                    <div data-input-init class="form-outline mb-4">
                      <label class="form-label" for="born" style="color: white;">Leadás dátuma:</label>
                      <input type="date" id="born" class="form-control rent2">
                    </div>
                    <div class="text-center pt-1 mb-5 pb-1">
                      <button data-button-init class="btn btn-dark mt-3 rent3" type="button">Bérlés</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div class="row justify-content-center">
    <table class="table mt-5 w-75">
      <thead>
        <tr>
          <th>Autó:</th>
          <th>Fogyasztás:</th>
          <th>Üzemanyag:</th>
          <th>Ajtószám:</th>
          <th>Lóerő:</th>
          <th>Váltó:</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><h5>{{data.autonev}}</h5></td>
          <td><h5>{{data.fogyasztas}} l/100km</h5></td>
          <td><h5 class="text-capitalize">{{data.uzemanyag}}</h5></td>
          <td><h5>{{data.ajtoszam}} ajtós</h5></td>
          <td><h5>{{data.loero}} lóerő</h5></td>
          <td><h5 class="text-capitalize">{{data.valtos}} váltó</h5></td>
        </tr>
      </tbody>
    </table>    
  </div>
</div>
