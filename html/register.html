<section class="loginForm">
  <div class="text-center mt-5 text-decoration-underline">
    <h1>Regisztráció</h1>
  </div>
  <div class="container moveFromRight delay-50">
    <div class="row d-flex justify-content-center align-items-center">
      <div class="col-xl-6 col-lg-6 col-md-8">
        <div class="card rounded-3 text-black card-body">
          <div class="row g-0">
            <div class="col-lg-12">
              <div>
                <div class="text-center">
                  <img src="./img/Logo2.png" alt="logo" id="loginLogo">
                  <h4 class="mt-1 mb-5 pb-1">LPT</h4>
                </div>

                <form name="reigsterForm">
                  <div class="row mb-3">
                    <label for="register-first_name" 
                          class="col-form-label col-12 col-md-5 text-md-end">
                      <i class="fa-solid fa-user fa-2xl me-1"></i>
                      <i class="fa-solid fa-star fa-2xs text-danger"></i>
                      <span class="text-capitalize">Vezetéknév</span>
                    </label>
                    <div class="col-11 col-md-6 position-relative">
                      <input id="register-first_name"
                             class="form-control"
                             name="first_name" 
                             type="text"
                             placeholder="first name"
                             spellcheck="false" 
                             autocomplete="off" 
                             required
                             maxlength="100"
                             ng-init="model.first_name=null"
                             ng-model="model.first_name"
                             ng-clear-icon>
                    </div>
                    <div class="col-1 d-flex align-items-center justify-content-start ps-1">
                      <span class="fw-bolder text-success"
                            ng-class="{'invisible': registerForm.first_name.$invalid}">
                      </span>
                    </div>
                  </div>
                  
                  <div data-input-init class="form-outline mb-4">
                    <label class="form-label" for="name">Középső név</label>
                    <input type="text" id="name" class="form-control" placeholder="Középső név">
                  </div>
                  <div data-input-init class="form-outline mb-4">
                    <label class="form-label" for="name">Keresztnév</label>
                    <input type="text" id="name" class="form-control" placeholder="Keresztnév">
                  </div>
                  <div data-input-init class="form-outline mb-4">
                    <label class="form-label" for="born">Születési év</label>
                    <input type="date" id="born" class="form-control">
                  </div>
                  <div data-input-init class="form-outline mb-4">
                    <label class="form-label" for="email">Email-cím</label>
                    <input type="email" id="email" class="form-control" placeholder="Email-cím">
                  </div>
                  <div data-input-init class="form-outline mb-4">
                    <label class="form-label" for="password">Jelszó</label>
                    <input type="password" id="password" class="form-control" placeholder="Jelszó">
                  </div>
                  <div data-input-init class="form-outline mb-4"></div>
                    <label class="form-label" for="confirm">Jelszó megerősítés</label>
                    <input type="password" id="confirm" class="form-control" placeholder="Jelszó megerősítés">
                  </div>
                  <div class="text-center pt-1 mb-5 pb-1">
                    <button data-button-init class="btn btn-dark mt-3" type="button">Regisztráció</button>
                  </div>
                  <div class="d-flex align-items-center justify-content-center pb-4">
                    <p class="mb-0 me-2">Van már fiókja?</p>
                    <button  type="button" data-button-init class="btn btn-outline-danger" ui-sref="login">Belépés</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
