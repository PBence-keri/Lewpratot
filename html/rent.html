<div class="container-fluid">

      <div class="card text-white">
        <img src="./img/audia8.jpg" class="card-img">
      </div>
    </div>
    <div class="col-md-6">
      <section class="loginForm">
        <div class="container">
          <div class="row d-flex justify-content-center align-items-center">
            <div class="text">
              <div class="card rounded-3 text-black card-body">
                <div class="row g-0">
                  <div class="col-lg-12">
                    <div>
                      <div class="text-center">
                        <img src="./img/Logo2.png" alt="logo" id="loginLogo">

                      </div>
                      <form>
                        <div data-input-init class="form-outline mb-4">

                        </div>
                        <div data-input-init class="form-outline mb-4">
                          <label class="form-label" for="email">Leadás helye</label>
                          <input type="email" id="email" class="form-control" placeholder="Pl.: Makó, Posta utca 4-6." min="2025-01-01">
                        </div>
                        <div data-input-init class="form-outline mb-4" id="felvetel">
                          <label class="form-label" for="born">Felvétel dátuma</label>
                          <input type="date" id="born" class="form-control" max="2025-12-31" min="2025-02-01" value="today">
                        </div>
                        <div data-input-init class="form-outline mb-4" id="leadas">
                          <label class="form-label" for="born">Leadás dátuma</label>
                          <input type="date" id="born" class="form-control" max="2025-12-31" min="2025-02-01">
                        </div>
                        <div class="text-center pt-1 mb-5 pb-1">
                          <button data-button-init class="btn btn-dark mt-3" type="button">Bérlés</button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
